<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гра 21</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="top-info">
<div id="player-box" class="score-box">
<div id="player-name">Користувач</div>
<div id="player-score" class="score">0</div>
</div>
<div class="attempts" id="attempts">Спроба 0 з 3</div>
<div id="cpu-box" class="score-box">
<div>Комп'ютер</div>
<div id="cpu-score" class="score">0</div>
</div>
</div>


<div class="board">
<div class="hand" id="player-hand">
<div class="card" id="player-card">
<div class="card-top"></div>
<div class="card-center">?</div>
<div class="card-bottom"></div>
</div>
</div>


<div class="center-controls">
<div id="message">Натисніть Generate</div>
<button id="generate">Generate</button>
</div>


<div class="hand" id="cpu-hand">
<div class="card" id="cpu-card">
<div class="card-top"></div>
<div class="card-center">?</div>
<div class="card-bottom"></div>
</div>
</div>
</div>


<script src="script.js"></script>
</body>
</html>
